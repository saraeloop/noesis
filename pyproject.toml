[build-system]
requires = ["hatchling>=1.21.0"]
build-backend = "hatchling.build"

[project]
name = "noesis"
version = "v0.6.1"
description = "Noēsis (νόησις) — a framework for intuition-guided agentic reasoning."
readme = { file = "README.md", content-type = "text/markdown" }
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Sara Loera" }]
keywords = ["agents", "ai", "intuition", "reasoning", "langgraph", "crewai"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
]
# Runtime deps only (none yet)
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "rich>=14.2.0",
    "rich-argparse>=1.7.1",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.0.45",
  "langchain>=0.1.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "import-linter>=2.0",
]
ui = [
  "gradio>=4.40",
  "streamlit>=1.39",
]

[dependency-groups]
dev = [
  "pytest>=7.4",
  "ruff>=0.5",
  "import-linter>=2.0",
]
ui = [
  "gradio>=4.40",
  "streamlit>=1.39",
]

[tool.uv]
default-groups = ["dev"]

[project.scripts]
noesis = "noesis.cli:main"


[project.urls]
Homepage = ""
Repository = ""
Documentation = ""

# Control build contents 
[tool.hatch.build]
exclude = ["tests", "tests/**"]
# Include only the package and selected top-level files
include = [
  "noesis/**",
  "examples/**",
  "LICENSE",
  "README.md",
  "pyproject.toml",
]
[tool.hatch.build.targets.sdist]
include = [
  "noesis/**",
  "examples/**",
  "docs/**",
  "flows/**",
  "README.md",
  "LICENSE",
  "pyproject.toml",
]

[tool.importlinter]
root_package = "noesis"

[[tool.importlinter.contracts]]
name = "Runtime must not import adapters"
type = "forbidden"
source_modules = [
  "noesis.runtime",
]
forbidden_modules = [
  "noesis.adapters",
]

[[tool.importlinter.contracts]]
name = "Adapters must not import runtime internals"
type = "forbidden"
source_modules = [
  "noesis.adapters",
]
forbidden_modules = [
  "noesis.runtime",
]
