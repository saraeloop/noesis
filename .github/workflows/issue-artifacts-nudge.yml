name: issue-artifacts-nudge

on:
  issues:
    types: [opened, edited]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const need = /##\s*Artifacts/i;
            if (!need.test(body)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                body: "🔎 Friendly nudge: please include the **Artifacts** block (dataset snapshot, schema fingerprint, faculty config, checkpoints). This helps us reproduce and benchmark quickly."
              });
            }
