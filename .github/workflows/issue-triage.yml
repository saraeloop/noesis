name: issue-triage

on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const title = context.payload.issue.title || "";
            const body = context.payload.issue.body || "";
            const labels = new Set();
            if (body.includes("Paper Reference") || title.startsWith("[Paper]")) {
              labels.add("type:paper-impl");
            }
            if (title.startsWith("[Experiment]") || body.includes("Experiment / benchmark")) {
              labels.add("type:benchmark");
            }
            if (title.startsWith("[Bug]")) {
              labels.add("type:bug");
            }
            if (title.startsWith("[Feature]")) {
              labels.add("type:feature");
            }
            if (title.startsWith("[Docs]")) {
              labels.add("type:docs");
            }
            if (labels.size) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.issue.number,
                labels: Array.from(labels),
              });
            }
