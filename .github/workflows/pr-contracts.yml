name: PR Contracts

on:
  pull_request:
    paths:
      - "noesis/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "RELEASE.md"
      - "ROADMAP.md"
      - ".github/workflows/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  dry-run-contracts:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync Python dependencies
        run: uv sync --dev

      - name: Install pnpm
        run: npm i -g pnpm@10.16.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "docs/pnpm-lock.yaml"

      - name: Verify pnpm
        run: |
          echo "PATH=$PATH"
          which pnpm
          pnpm -v

      - name: Install docs dependencies
        working-directory: docs
        run: pnpm install --frozen-lockfile

      - name: Validate export surface
        run: uv run python scripts/validate_exports.py --strict

      - name: Pre-release dry run
        run: uv run python scripts/pre_release.py --check-all

      - name: Upload pre-release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-summary-${{ matrix.python }}
          path: |
            .noesis/prerelease
          if-no-files-found: ignore

  post-summary-comment:
    name: Post Noēsis pre-release summary
    needs: dry-run-contracts
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download prerelease summaries
        uses: actions/download-artifact@v4
        with:
          pattern: prerelease-summary-*
          path: summaries
          merge-multiple: true

      - name: Build combined summary
        id: build
        run: |
          if ls summaries/*/summary.txt >/dev/null 2>&1; then
            cat summaries/*/summary.txt > combined.txt
          elif ls summaries/summary.txt >/dev/null 2>&1; then
            cp summaries/summary.txt combined.txt
          else
            echo "No summary artifacts found" > combined.txt
          fi
          {
            echo "body<<EOF"
            echo "### 🧪 Noēsis pre-release (dry-run)"
            echo
            sed -e 's/^/    /' combined.txt
            echo
            echo "_(bot: updates on new commits)_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.build.outputs.body }}
          comment-id: noesis-prerelease-summary-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          edit-mode: replace
          reactions: '+1'

  unit-tests:
    name: unit-tests (pytest)
    needs: dry-run-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
      - run: uv sync --dev
      - run: uv run python -m pytest

  diagnostics:
    name: diagnostics --check-all
    needs: dry-run-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
      - run: uv sync --dev
      - run: uv run python scripts/pre_release.py --check-all

  docs-build:
    name: docs: build (your Nextra/pnpm build)
    needs: dry-run-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm i -g pnpm@10.16.1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm run build
        working-directory: docs

  build-wheel:
    name: build-wheel (packaging)
    needs: dry-run-contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
      - run: uv sync --dev
      - run: uv run python -m build