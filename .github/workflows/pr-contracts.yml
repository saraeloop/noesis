name: PR Contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches:
      - "**"
    paths:
      - "noesis/**"
      - "docs/**"
      - "scripts/**"
      - "tests/**"
      - "pyproject.toml"
      - "uv.lock"
      - "RELEASE.md"
      - "ROADMAP.md"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  determine-changes:
    name: Detect relevant file changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi

          if [[ -z "${base_sha}" || "${base_sha}" == "0000000000000000000000000000000000000000" ]]; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          changed_files="$(git diff --name-only "${base_sha}" "${{ github.sha }}" || true)"
          if echo "${changed_files}" | grep -Eq '^(noesis/|docs/|scripts/|tests/|pyproject\.toml$|uv\.lock$|RELEASE\.md$|ROADMAP\.md$|\.github/workflows/)'; then
            echo "contracts=true" >> "$GITHUB_OUTPUT"
          else
            echo "contracts=false" >> "$GITHUB_OUTPUT"
          fi

  dry-run-contracts:
    runs-on: ubuntu-latest
    needs: determine-changes
    if: needs.determine-changes.outputs.contracts == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync Python dependencies
        run: uv sync --dev

      - name: Validate export surface (non-strict during docs migration)
        run: uv run python scripts/validate_exports.py

      - name: Pre-release dry run
        run: uv run python scripts/pre_release.py --check-all
        env:
          NOESIS_RUNS_DIR: ./.noesis-ci/smoke-runs
          NOESIS_LEARN_HOME: ./.noesis-ci/state

      - name: Upload pre-release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-summary-${{ matrix.python }}
          path: |
            .noesis-ci/prerelease
          if-no-files-found: ignore

  unit-tests:
    name: unit-tests (pytest)
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping unit-tests."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip uv
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --all-extras
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python -m pytest
        if: needs.determine-changes.outputs.contracts == 'true'

  diagnostics:
    name: diagnostics --check-all
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping diagnostics."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip uv
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --dev
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python scripts/pre_release.py --check-all
        if: needs.determine-changes.outputs.contracts == 'true'
        env:
          NOESIS_RUNS_DIR: ./.noesis-ci/smoke-runs
          NOESIS_LEARN_HOME: ./.noesis-ci/state

  docs-build:
    name: "docs: check (Mintlify)"
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping docs build."
          exit 0

      - name: Set up Node
        if: needs.determine-changes.outputs.contracts == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mintlify CLI
        if: needs.determine-changes.outputs.contracts == 'true'
        run: npm i -g mintlify

      - name: Check docs (Mintlify broken links)
        if: needs.determine-changes.outputs.contracts == 'true'
        continue-on-error: true
        working-directory: docs
        run: mintlify broken-links

  build-wheel:
    name: build-wheel (packaging)
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping build-wheel."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - run: python -m pip install --upgrade pip uv
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --all-extras
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python -m build
        if: needs.determine-changes.outputs.contracts == 'true'

  contracts-skip-note:
    name: contracts checks (not required)
    needs: determine-changes
    if: needs.determine-changes.outputs.contracts != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant files changed; PR contract checks skipped."
