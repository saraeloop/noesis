name: PR Contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  determine-changes:
    name: Detect relevant file changes
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          base: ${{ github.event.pull_request.base.sha }}
          filters: |
            contracts:
              - "noesis/**"
              - "docs/**"
              - "scripts/**"
              - "tests/**"
              - "pyproject.toml"
              - "uv.lock"
              - "RELEASE.md"
              - "ROADMAP.md"
              - ".github/workflows/**"

  dry-run-contracts:
    runs-on: ubuntu-latest
    needs: determine-changes
    if: needs.determine-changes.outputs.contracts == 'true'
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v1

      - name: Sync Python dependencies
        run: uv sync --dev

      - name: Validate export surface (non-strict during docs migration)
        run: uv run python scripts/validate_exports.py

      - name: Pre-release dry run
        run: uv run python scripts/pre_release.py --check-all
        env:
          NOESIS_RUNS_DIR: ./.noesis-ci/smoke-runs
          NOESIS_LEARN_HOME: ./.noesis-ci/state

      - name: Upload pre-release summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prerelease-summary-${{ matrix.python }}
          path: |
            .noesis-ci/prerelease
          if-no-files-found: ignore

  post-summary-comment:
    name: Post Noēsis pre-release summary
    needs: [determine-changes, dry-run-contracts]
    if: needs.determine-changes.outputs.contracts == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download prerelease summaries
        uses: actions/download-artifact@v4
        with:
          pattern: prerelease-summary-*
          path: summaries
          merge-multiple: true

      - name: Build combined summary
        id: build
        run: |
          if ls summaries/*/summary.txt >/dev/null 2>&1; then
            cat summaries/*/summary.txt > combined.txt
          elif ls summaries/summary.txt >/dev/null 2>&1; then
            cp summaries/summary.txt combined.txt
          else
            echo "No summary artifacts found" > combined.txt
          fi
          {
            echo "body<<EOF"
            echo "### 🧪 Noēsis pre-release (dry-run)"
            echo
            sed -e 's/^/    /' combined.txt
            echo
            echo "_(bot: updates on new commits)_"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create or update PR comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: ${{ steps.build.outputs.body }}
          comment-id: noesis-prerelease-summary-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          edit-mode: replace
          reactions: '+1'

  unit-tests:
    name: unit-tests (pytest)
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping unit-tests."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --all-extras
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python -m pytest
        if: needs.determine-changes.outputs.contracts == 'true'

  diagnostics:
    name: diagnostics --check-all
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping diagnostics."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --dev
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python scripts/pre_release.py --check-all
        if: needs.determine-changes.outputs.contracts == 'true'
        env:
          NOESIS_RUNS_DIR: ./.noesis-ci/smoke-runs
          NOESIS_LEARN_HOME: ./.noesis-ci/state

  docs-build:
    name: "docs: check (Mintlify)"
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping docs build."
          exit 0

      - name: Set up Node
        if: needs.determine-changes.outputs.contracts == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Mintlify CLI
        if: needs.determine-changes.outputs.contracts == 'true'
        run: npm i -g mintlify

      - name: Check docs (Mintlify broken links)
        if: needs.determine-changes.outputs.contracts == 'true'
        working-directory: docs
        run: mintlify broken-links

  build-wheel:
    name: build-wheel (packaging)
    needs: determine-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if contracts not touched
        if: needs.determine-changes.outputs.contracts != 'true'
        run: |
          echo "No relevant files changed; skipping build-wheel."
          exit 0

      - uses: actions/setup-python@v5
        if: needs.determine-changes.outputs.contracts == 'true'
        with: { python-version: "3.12" }
      - uses: astral-sh/setup-uv@v1
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv sync --all-extras
        if: needs.determine-changes.outputs.contracts == 'true'
      - run: uv run python -m build
        if: needs.determine-changes.outputs.contracts == 'true'

  contracts-skip-note:
    name: contracts checks (not required)
    needs: determine-changes
    if: needs.determine-changes.outputs.contracts != 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo "No relevant files changed; PR contract checks skipped."
